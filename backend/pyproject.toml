[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onboarder"
version = "0.1.0"
description = "A command-line tool for scanning and parsing Python codebases."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "fastapi>=0.143.0",
    "psycopg[binary]",
    "pydantic-settings",
    "sqlalchemy>=2",
    "typer>=0.12,<1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.3",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/onboarder"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
extend-exclude = ["tests/fixtures"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
files = ["src"]
