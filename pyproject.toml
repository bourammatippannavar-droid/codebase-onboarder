[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onboarder"
version = "0.1.0"
description = "A command-line tool for scanning and parsing Python codebases."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["typer>=0.12,<1"]

[dependency-groups]
dev = ["mypy>=1.10", "pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/onboarder"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
extend-exclude = ["tests/fixtures"]